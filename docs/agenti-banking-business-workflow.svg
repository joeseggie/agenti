<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1540" viewBox="0 0 2200 1540">
<title>Agenti universal CSV daily bank control</title>
<desc>Current teller, application, Admin and Supervisor steps for transaction-date daily bank control, with review limits and audited exception handling.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#495057" stroke-width="1.5"/></marker></defs>
<rect width="2200" height="1540" fill="#ffffff"/>
<text id="title" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#000000" text-anchor="start"><tspan x="60" y="57">Agenti: universal CSV daily bank control</tspan></text>
<text id="subtitle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000" text-anchor="start"><tspan x="60" y="94">Teller session operations continue in web and Android; statement upload and reconciliation are Web Admin workflows.</tspan></text>
<rect id="cutoff-callout" x="60" y="135" width="2080" height="112" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
<text id="cutoff-callout-text" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000" text-anchor="start"><tspan x="82" y="170">Daily control follows transaction dates. Date-only statements do not prove exact session cutoffs; never fabricate times.</tspan><tspan x="82" y="197">Unknowns and unexplained differences stay open. Outstanding daily review warns but does not block the next session opening.</tspan></text>
<rect id="teller-lane" x="50" y="280" width="500" height="1085" rx="14" fill="transparent" stroke="#495057" stroke-width="2"/>
<rect id="teller-lane-heading" x="64" y="296" width="472" height="72" rx="14" fill="#a5d8ff" stroke="#1864ab" stroke-width="2"/>
<text id="teller-lane-heading-text" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#000000" text-anchor="middle"><tspan x="300" y="331">TELLER / AGENT</tspan></text>
<rect id="app-lane" x="575" y="280" width="500" height="1085" rx="14" fill="transparent" stroke="#495057" stroke-width="2"/>
<rect id="app-lane-heading" x="589" y="296" width="472" height="72" rx="14" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text id="app-lane-heading-text" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#000000" text-anchor="middle"><tspan x="825" y="331">AGENTI APPLICATION</tspan></text>
<rect id="admin-lane" x="1100" y="280" width="500" height="1085" rx="14" fill="transparent" stroke="#495057" stroke-width="2"/>
<rect id="admin-lane-heading" x="1114" y="296" width="472" height="72" rx="14" fill="#f3d9fa" stroke="#862e9c" stroke-width="2"/>
<text id="admin-lane-heading-text" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#000000" text-anchor="middle"><tspan x="1350" y="331">WEB ADMIN</tspan></text>
<rect id="supervisor-lane" x="1625" y="280" width="500" height="1085" rx="14" fill="transparent" stroke="#495057" stroke-width="2"/>
<rect id="supervisor-lane-heading" x="1639" y="296" width="472" height="72" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
<text id="supervisor-lane-heading-text" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#000000" text-anchor="middle"><tspan x="1875" y="331">SUPERVISOR</tspan></text>
<rect id="close-session" x="75" y="415" width="450" height="180" rx="14" fill="#a5d8ff" stroke="#1864ab" stroke-width="2"/>
<text id="close-session-text" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="start"><tspan x="93" y="447">1  CLOSE THE SESSION</tspan><tspan x="93" y="471.3">Submit actual wallet observations.</tspan><tspan x="93" y="495.6">Trading ends; statement review can follow later.</tspan></text>
<rect id="freeze-settle" x="600" y="415" width="450" height="180" rx="14" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text id="freeze-settle-text" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="start"><tspan x="618" y="447">2  FREEZE AND SETTLE ONCE</tspan><tspan x="618" y="471.3">Snapshot and operational settlement are recorded.</tspan><tspan x="618" y="495.6">Later review does not replay money movements.</tspan></text>
<rect id="prepare-csv" x="1125" y="415" width="450" height="180" rx="14" fill="#f3d9fa" stroke="#862e9c" stroke-width="2"/>
<text id="prepare-csv-text" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="start"><tspan x="1143" y="447">3  PREPARE THE UNIVERSAL CSV</tspan><tspan x="1143" y="471.3">Select account/date range; convert the source</tspan><tspan x="1143" y="495.6">outside Agenti. First empty period: audited</tspan><tspan x="1143" y="519.9">opening baseline + reason.</tspan></text>
<rect id="upload-validate" x="600" y="650" width="450" height="180" rx="14" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text id="upload-validate-text" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="start"><tspan x="618" y="682">4  VALIDATE AND PARTITION</tspan><tspan x="618" y="706.3">Exact v1 headers/order and row arithmetic;</tspan><tspan x="618" y="730.6">range continuity, open sessions and overlaps</tspan><tspan x="618" y="754.9">are checked before commit.</tspan></text>
<rect id="review-commit" x="1125" y="650" width="450" height="180" rx="14" fill="#f3d9fa" stroke="#862e9c" stroke-width="2"/>
<text id="review-commit-text" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="start"><tspan x="1143" y="682">5  PREVIEW AND COMMIT</tspan><tspan x="1143" y="706.3">Review diagnostics and daily balances/movements.</tspan><tspan x="1143" y="730.6">Accepted rows become private, versioned evidence.</tspan></text>
<rect id="supervisor-flag" x="1650" y="890" width="450" height="180" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
<text id="supervisor-flag-text" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="start"><tspan x="1668" y="922">6  SUPERVISOR REVIEW</tspan><tspan x="1668" y="946.3">Inspect the daily control; raise an attributed</tspan><tspan x="1668" y="970.6">flag with a reason if evidence or outcome</tspan><tspan x="1668" y="994.9">is concerning.</tspan></text>
<rect id="daily-status" x="600" y="890" width="450" height="180" rx="14" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text id="daily-status-text" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="start"><tspan x="618" y="922">DAILY OUTCOME</tspan><tspan x="618" y="946.3">Reconciled / WithExceptions / NeedsReview.</tspan><tspan x="618" y="970.6">Unknown or unexplained movement keeps</tspan><tspan x="618" y="994.9">the date open; no exact cutoff certification.</tspan></text>
<rect id="match-classify" x="1125" y="890" width="450" height="180" rx="14" fill="#f3d9fa" stroke="#862e9c" stroke-width="2"/>
<text id="match-classify-text" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="start"><tspan x="1143" y="922">7  MATCH AND CLASSIFY</tspan><tspan x="1143" y="946.3">Auto-match only unique exact candidates.</tspan><tspan x="1143" y="970.6">Resolve ambiguity manually; explain bank-only</tspan><tspan x="1143" y="994.9">rows. Unknown is never a balancing adjustment.</tspan></text>
<rect id="admin-response" x="1125" y="1120" width="450" height="180" rx="14" fill="#f3d9fa" stroke="#862e9c" stroke-width="2"/>
<text id="admin-response-text" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="start"><tspan x="1143" y="1152">8  RESPOND OR REVISE</tspan><tspan x="1143" y="1176.3">Admin records a note or void reason for a flag.</tspan><tspan x="1143" y="1200.6">Corrections create a retained revision;</tspan><tspan x="1143" y="1224.9">re-review the affected days.</tspan></text>
<rect id="next-opening" x="75" y="890" width="450" height="180" rx="14" fill="#a5d8ff" stroke="#1864ab" stroke-width="2"/>
<text id="next-opening-text" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="start"><tspan x="93" y="922">NEXT BUSINESS DAY</tspan><tspan x="93" y="946.3">Teller follows the normal opening approval.</tspan><tspan x="93" y="970.6">Unresolved daily bank control is a warning,</tspan><tspan x="93" y="994.9">not an opening blocker.</tspan></text>
<rect id="audit-history" x="1650" y="1120" width="450" height="180" rx="14" fill="#dee2e6" stroke="#495057" stroke-width="2"/>
<text id="audit-history-text" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="start"><tspan x="1668" y="1152">AUDIT HISTORY</tspan><tspan x="1668" y="1176.3">Baseline, upload, matches, classifications,</tspan><tspan x="1668" y="1200.6">flags, responses and revisions are attributed.</tspan><tspan x="1668" y="1224.9">No silent overwrite of prior evidence.</tspan></text>
<polyline points="525,505 600,505" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1050,505 1125,505" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1350,595 1350,650" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1050,740 1125,740" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1350,830 1350,890" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1125,980 1050,980" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1575,980 1650,980" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1650,1070 1595,1100 1575,1165" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1575,1200 1625,1200" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="600,980 525,980" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1125,1220 1080,1220 1080,740 1050,740" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="10 7"/>
<text id="footer" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#000000" text-anchor="start"><tspan x="60" y="1417">Bank statement import is not available in Android. Opening approvals, session safeguards and vault controls remain unchanged.</tspan><tspan x="60" y="1439.95">See the Enrollment Guide for CSV mapping, baseline setup, exception handling and go-live checks.</tspan></text>
</svg>
