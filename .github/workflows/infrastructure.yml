name: Provision Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Resource Group name"
        required: false
        default: "agenti-rg"
        type: string
      location:
        description: "Azure region"
        required: false
        default: "uaenorth"
        type: string
      app_name:
        description: "Web App name"
        required: false
        default: "agenti"
        type: string
      postgres_server:
        description: "PostgreSQL Flexible Server name"
        required: false
        default: "agenti-pgserver"
        type: string
      app_service_plan:
        description: "App Service Plan name"
        required: false
        default: "agenti-plan"
        type: string

concurrency:
  group: infrastructure-provision
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  POSTGRES_USER: "agenti_user"
  POSTGRES_DB: "agenti_prod"

jobs:
  provision:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    environment: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate PostgreSQL password
        id: config
        run: |
          PG_PASS=$(openssl rand -base64 24 | tr -d '+/=' | head -c 20)
          PG_PASS="${PG_PASS}Ag1!"
          echo "::add-mask::${PG_PASS}"
          echo "pg_password=${PG_PASS}" >> "$GITHUB_OUTPUT"

      - name: Register required resource providers
        run: |
          az provider register --namespace Microsoft.DBforPostgreSQL --wait
          az provider register --namespace Microsoft.Web --wait

      - name: "[1/6] Create Resource Group"
        run: |
          az group create \
            --name "${{ inputs.resource_group }}" \
            --location "${{ inputs.location }}" \
            --output none

      - name: "[2/6] Create PostgreSQL Flexible Server"
        id: postgres
        run: |
          RG="${{ inputs.resource_group }}"
          PG_SERVER="${{ inputs.postgres_server }}"
          PG_PASS="${{ steps.config.outputs.pg_password }}"
          LOCATION="${{ inputs.location }}"

          # Check if server already exists
          EXISTING=$(az postgres flexible-server show \
            --resource-group "$RG" \
            --name "$PG_SERVER" \
            --query "fullyQualifiedDomainName" -o tsv 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "PostgreSQL server already exists: $EXISTING"

            # Update admin password so the connection string stays in sync
            az postgres flexible-server update \
              --resource-group "$RG" \
              --name "$PG_SERVER" \
              --admin-password "$PG_PASS" \
              --output none

            echo "pg_fqdn=${EXISTING}" >> "$GITHUB_OUTPUT"
            echo "reused=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          az postgres flexible-server create \
            --resource-group "$RG" \
            --name "$PG_SERVER" \
            --location "$LOCATION" \
            --admin-user "${{ env.POSTGRES_USER }}" \
            --admin-password "$PG_PASS" \
            --sku-name Standard_B1ms \
            --tier Burstable \
            --storage-size 32 \
            --version 16 \
            --yes \
            --output none

          # Allow Azure services to access the server
          az postgres flexible-server firewall-rule create \
            --resource-group "$RG" \
            --name "$PG_SERVER" \
            --rule-name AllowAzureServices \
            --start-ip-address 0.0.0.0 \
            --end-ip-address 0.0.0.0 \
            --output none

          # Create the application database
          az postgres flexible-server db create \
            --resource-group "$RG" \
            --server-name "$PG_SERVER" \
            --database-name "${{ env.POSTGRES_DB }}" \
            --output none

          PG_FQDN=$(az postgres flexible-server show \
            --resource-group "$RG" \
            --name "$PG_SERVER" \
            --query "fullyQualifiedDomainName" -o tsv)

          echo "pg_fqdn=${PG_FQDN}" >> "$GITHUB_OUTPUT"
          echo "reused=false" >> "$GITHUB_OUTPUT"

      - name: "[3/6] Create App Service Plan"
        run: |
          az appservice plan create \
            --resource-group "${{ inputs.resource_group }}" \
            --name "${{ inputs.app_service_plan }}" \
            --location "${{ inputs.location }}" \
            --sku B1 \
            --is-linux \
            --output none

      - name: "[4/6] Create Web App"
        run: |
          az webapp create \
            --resource-group "${{ inputs.resource_group }}" \
            --plan "${{ inputs.app_service_plan }}" \
            --name "${{ inputs.app_name }}" \
            --runtime "DOTNETCORE:10.0" \
            --output none

          # Enable basic auth on SCM site (required for zip deployment)
          az resource update \
            --resource-group "${{ inputs.resource_group }}" \
            --name scm \
            --namespace Microsoft.Web \
            --resource-type basicPublishingCredentialsPolicies \
            --parent "sites/${{ inputs.app_name }}" \
            --set properties.allow=true \
            --output none

      - name: "[5/6] Configure Web App"
        run: |
          RG="${{ inputs.resource_group }}"
          APP="${{ inputs.app_name }}"
          PG_FQDN="${{ steps.postgres.outputs.pg_fqdn }}"
          PG_PASS="${{ steps.config.outputs.pg_password }}"

          CONN_STR="Server=${PG_FQDN};Port=5432;Database=${{ env.POSTGRES_DB }};User Id=${{ env.POSTGRES_USER }};Password=${PG_PASS};Ssl Mode=Require;"
          echo "::add-mask::${CONN_STR}"

          # Set connection string (encrypted at rest in App Service Configuration)
          az webapp config connection-string set \
            --resource-group "$RG" \
            --name "$APP" \
            --connection-string-type PostgreSQL \
            --settings DefaultConnection="$CONN_STR" \
            --output none

          # Set app settings (disable Oryx build since we deploy pre-built binaries)
          az webapp config appsettings set \
            --resource-group "$RG" \
            --name "$APP" \
            --settings ASPNETCORE_ENVIRONMENT=Production SCM_DO_BUILD_DURING_DEPLOYMENT=false \
            --output none

      - name: "[6/6] Build and Deploy App"
        id: deploy
        run: |
          dotnet publish EastSeat.Agenti.Web/EastSeat.Agenti.Web.csproj \
            --configuration Release \
            --output ./publish

          cd ./publish && zip -r ../publish.zip . && cd ..

          az webapp deploy \
            --resource-group "${{ inputs.resource_group }}" \
            --name "${{ inputs.app_name }}" \
            --src-path publish.zip \
            --type zip \
            --output none

          APP_URL=$(az webapp show \
            --resource-group "${{ inputs.resource_group }}" \
            --name "${{ inputs.app_name }}" \
            --query "defaultHostName" -o tsv)

          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"

      - name: Output deployment summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Infrastructure Provisioning Complete

          | Resource | Value |
          |----------|-------|
          | Resource Group | \`${{ inputs.resource_group }}\` |
          | Location | \`${{ inputs.location }}\` |
          | PostgreSQL Server | \`${{ steps.postgres.outputs.pg_fqdn }}\` |
          | App Service Plan | \`${{ inputs.app_service_plan }}\` (B1 Linux) |
          | Web App | \`${{ inputs.app_name }}\` |
          | **App URL** | **https://${{ steps.deploy.outputs.app_url }}** |

          ### Next Steps

          1. **Open the App URL** above to complete initial setup (create admin user and branch).
          2. The PostgreSQL password is stored in App Service Configuration (connection string).
          3. Future deployments happen automatically when pushing to \`main\`.

          ### Cost-Saving Tip

          To stop PostgreSQL when not in use (saves ~\$12-14/month on compute):
          \`\`\`
          az postgres flexible-server stop --resource-group ${{ inputs.resource_group }} --name ${{ inputs.postgres_server }}
          \`\`\`
          To restart:
          \`\`\`
          az postgres flexible-server start --resource-group ${{ inputs.resource_group }} --name ${{ inputs.postgres_server }}
          \`\`\`
          EOF

      - name: Azure logout
        run: az logout
        if: always()
