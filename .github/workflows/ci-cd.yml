name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]

permissions:
  id-token: write
  contents: read
  checks: write

env:
  DOTNET_VERSION: "10.0.x"
  AZURE_WEBAPP_NAME: agenti
  AZURE_RESOURCE_GROUP: agenti-rg
  TEST_DB_USER: agenti_user
  TEST_DB_NAME: agenti_test

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        # Restore only Linux-compatible projects (iOS requires macOS and is built in a separate job)
        run: |
          dotnet restore EastSeat.Agenti.Web/EastSeat.Agenti.Web.csproj
          dotnet restore EastSeat.Agenti.Android/EastSeat.Agenti.Android.csproj
          dotnet restore EastSeat.Agenti.Mcp/EastSeat.Agenti.Mcp.csproj

      - name: Build solution
        # Build only Linux-compatible projects (iOS requires macOS and is built in a separate job)
        run: |
          dotnet build EastSeat.Agenti.Web/EastSeat.Agenti.Web.csproj --configuration Release --no-restore
          dotnet build EastSeat.Agenti.Android/EastSeat.Agenti.Android.csproj --configuration Release --no-restore
          dotnet build EastSeat.Agenti.Mcp/EastSeat.Agenti.Mcp.csproj --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish EastSeat.Agenti.Web/EastSeat.Agenti.Web.csproj --configuration Release --no-build --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish
          retention-days: 1

  build-ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Restore iOS dependencies
        run: dotnet restore EastSeat.Agenti.iOS/EastSeat.Agenti.iOS.csproj

      - name: Build iOS app (Simulator)
        run: dotnet build EastSeat.Agenti.iOS/EastSeat.Agenti.iOS.csproj --configuration Release --no-restore -p:RuntimeIdentifier=iossimulator-arm64

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore tests/EastSeat.Agenti.UnitTests/EastSeat.Agenti.UnitTests.csproj

      - name: Run unit tests
        run: dotnet test tests/EastSeat.Agenti.UnitTests/EastSeat.Agenti.UnitTests.csproj --configuration Release --logger trx --results-directory TestResults --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults
          retention-days: 7

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: ${{ env.TEST_DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenti_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore tests/EastSeat.Agenti.IntegrationTests/EastSeat.Agenti.IntegrationTests.csproj

      - name: Run integration tests
        run: dotnet test tests/EastSeat.Agenti.IntegrationTests/EastSeat.Agenti.IntegrationTests.csproj --configuration Release --logger trx --results-directory TestResults
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Port=5432;Database=${{ env.TEST_DB_NAME }};User Id=${{ env.TEST_DB_USER }};Password=${{ secrets.TEST_DB_PASSWORD }};"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: TestResults
          retention-days: 7

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: ${{ env.TEST_DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenti_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore tests/EastSeat.Agenti.E2ETests/EastSeat.Agenti.E2ETests.csproj

      - name: Run E2E tests
        run: dotnet test tests/EastSeat.Agenti.E2ETests/EastSeat.Agenti.E2ETests.csproj --configuration Release --logger trx --results-directory TestResults
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Port=5432;Database=${{ env.TEST_DB_NAME }};User Id=${{ env.TEST_DB_USER }};Password=${{ secrets.TEST_DB_PASSWORD }};"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: TestResults
          retention-days: 7

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build, test-unit, test-integration, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Azure logout
        run: az logout
        if: always()
