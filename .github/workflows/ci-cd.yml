name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]

permissions:
  id-token: write
  contents: read
  checks: write

env:
  DOTNET_VERSION: "10.0.x"
  AZURE_WEBAPP_NAME: agenti
  AZURE_RESOURCE_GROUP: agenti-rg
  TEST_DB_USER: agenti_user
  TEST_DB_NAME: agenti_test

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish EastSeat.Agenti.Web/EastSeat.Agenti.Web.csproj --configuration Release --no-build --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish
          retention-days: 1

      - name: Publish MCP application
        run: dotnet publish EastSeat.Agenti.Mcp/EastSeat.Agenti.Mcp.csproj --configuration Release --no-build --output ./publish-mcp

      - name: Upload MCP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-webapp
          path: ./publish-mcp
          retention-days: 1

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore tests/EastSeat.Agenti.UnitTests/EastSeat.Agenti.UnitTests.csproj

      - name: Run unit tests
        run: dotnet test tests/EastSeat.Agenti.UnitTests/EastSeat.Agenti.UnitTests.csproj --configuration Release --logger trx --results-directory TestResults --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults
          retention-days: 7

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore tests/EastSeat.Agenti.IntegrationTests/EastSeat.Agenti.IntegrationTests.csproj

      - name: Run integration tests
        run: dotnet test tests/EastSeat.Agenti.IntegrationTests/EastSeat.Agenti.IntegrationTests.csproj --configuration Release --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: TestResults
          retention-days: 7

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore tests/EastSeat.Agenti.E2ETests/EastSeat.Agenti.E2ETests.csproj

      - name: Build browser tests
        run: dotnet build tests/EastSeat.Agenti.E2ETests/EastSeat.Agenti.E2ETests.csproj --configuration Release --no-restore

      - name: Install Playwright browser
        run: pwsh tests/EastSeat.Agenti.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests
        run: dotnet test tests/EastSeat.Agenti.E2ETests/EastSeat.Agenti.E2ETests.csproj --configuration Release --no-build --filter "Category!=AndroidDevice" --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: TestResults
          retention-days: 7

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build, test-unit, test-integration, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Azure logout
        run: az logout
        if: always()

  deploy-mcp:
    name: Deploy authenticated MCP
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.MCP_DEPLOY_ENABLED == 'true'
    environment:
      name: production
    env:
      AZURE_MCP_WEBAPP_NAME: ${{ vars.AZURE_MCP_WEBAPP_NAME }}
      AZURE_MCP_PLAN_NAME: agenti-plan

    steps:
      - name: Download MCP artifact
        uses: actions/download-artifact@v4
        with:
          name: mcp-webapp
          path: ./publish-mcp

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify dedicated shared-plan target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_MCP_WEBAPP_NAME"
          test "$AZURE_MCP_WEBAPP_NAME" != "$AZURE_WEBAPP_NAME"
          plan=$(az appservice plan show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_MCP_PLAN_NAME" --query id -o tsv)
          actual=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_MCP_WEBAPP_NAME" --query serverFarmId -o tsv)
          test "${plan,,}" = "${actual,,}"
          test "$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_MCP_WEBAPP_NAME" --query 'tags."agenti-component"' -o tsv)" = mcp
          test "$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_MCP_WEBAPP_NAME" --query httpsOnly -o tsv)" = true
          host=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_MCP_WEBAPP_NAME" --query defaultHostName -o tsv)
          echo "origin=https://$host" >> "$GITHUB_OUTPUT"

      - name: Deploy MCP to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_MCP_WEBAPP_NAME }}
          package: ./publish-mcp

      - name: Verify readiness and authentication gate
        env:
          MCP_ORIGIN: ${{ steps.target.outputs.origin }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 "$MCP_ORIGIN/health/ready"
          test "$(curl --request POST --silent --show-error --output /dev/null --write-out '%{http_code}' "$MCP_ORIGIN/mcp")" = 401

      - name: Azure logout
        run: az logout
        if: always()
